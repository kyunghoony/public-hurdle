name: Refresh Universe

on:
  schedule:
    - cron: "30 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m hurdle.cli fetch --pool data/kr_pool.csv --out data/kr_top100.csv --top 100
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kr_top100.csv
          if git diff --cached --quiet; then
            echo "No universe changes."
            exit 0
          fi
          git commit -m "data: refresh KR universe"
          git push
