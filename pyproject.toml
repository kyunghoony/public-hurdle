[project]
name = "public-hurdle"
version = "0.1.0"
description = "Sector Public Hurdle System - cross-asset opportunity-cost discipline for private deal screening"
requires-python = ">=3.10"
dependencies = ["curl_cffi>=0.7", "requests>=2.28", "PyYAML>=6.0", "typing_extensions>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
hurdle = "hurdle.cli:main"
hurdle-web = "hurdle.web:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hurdle = ["ui/*.html", "ui/*.css", "ui/*.js"]
